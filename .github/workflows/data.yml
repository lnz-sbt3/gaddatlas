name: verifica dati

on:
  push:
    paths: ['data/**', 'ontology/**', 'tools/**', 'Makefile']
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 serve a check_reproducible.py, che confronta con HEAD
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rdflib pandas pyyaml openpyxl pyshacl

      - name: rigenera i derivati dalle sorgenti
        run: make rdf geojson passages

      - name: verifica di coerenza fra sorgenti e derivati
        run: make audit

      - name: validazione SHACL
        run: make shacl

      - name: competency e integrity query
        run: make queries

      # Non `git diff`: l'ordine dei nodi anonimi nei TTL non e' deterministico
      # in rdflib, quindi il confronto byte-a-byte fallirebbe sempre pur essendo
      # i grafi identici. check_reproducible.py confronta i TTL per isomorfismo
      # e i JSON per contenuto.
      - name: i derivati versionati devono coincidere con la build
        run: python3 tools/check_reproducible.py