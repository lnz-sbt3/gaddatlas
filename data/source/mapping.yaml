# ============================================================
# FILE: References.tsv (PlaceReferences)
# ============================================================
mappings:
  References:
    source_file: "References.tsv"
    
    # ========================================================
    # PLACEREFERENCE
    # ========================================================
    Reference_ID:
      as_uri: "https://w3id.org/gaddatlas/id/reference/{value}"
      rdf_type:
        - "chora:PlaceReference"
      
      # Object properties 
      link:
        # Testimone dell'occorrenza (D-053, D-055), obbligatorio. L'opera
        # (chora:appearsInWork) non ha colonna: l'ETL la deriva dal testimone
        # (appearsInWitness / witnessOf).
        - property: "chora:appearsInWitness"
          column: "Witness_ID"
          to: "@Witness_ID"
        
        # Collegamento a Chapter
        - property: "chora:mentionedInChapter"
          column: "Chapter_ID"
          to: "@Chapter_ID"
          optional: true

      # Datatype properties
      literal:
        # Excerpt (citazione testuale)
        - column: "Excerpt"
          property: "chora:excerpt"
          lang: "it"
          optional: true
        
        # Source Reference (pointer testuale)
        - column: "Source_Reference"
          property: "chora:sourceReference"
          datatype: "xsd:string"
          optional: true
        
        # Forma stampata nel testimone, se diversa dall'etichetta del luogo (D-059)
        - column: "Attested_Form"
          property: "chora:attestedForm"
          lang: "it"
          optional: true

        # Notes (note editoriali/testuali)
        - column: "Notes"
          property: "rdfs:comment"
          lang: "it"
          optional: true

# ============================================================
# FILE: NarrativePlaces.tsv (Luoghi narrativi stabilizzati)
# ============================================================
  NarrativePlaces:
    source_file: "NarrativePlaces.tsv"
    
    NarrativePlace_ID:
      as_uri: "https://w3id.org/gaddatlas/id/narrativeplace/{value}"
      # v4.1.1: DiscreteNarrativePlace eliminata, unificata in chora:NarrativePlace
      rdf_type:
        - "chora:NarrativePlace"
      
      # Object properties
      link:
        # Place Category (vocabolario controllato)
        - column: "Place_Category"
          property: "chora:hasPlaceCategory"
          vocabulary: "place_categories"
          optional: true

        # Reality status (v4.1.1: spostato qui da SpatialInterpretations.assignsRealityStatus;
        # proprietà invariante del luogo, non dipendente da focalizzatore/interpretazione)
        - column: "Reality_Status"
          property: "chora:hasRealityStatus"
          vocabulary: "reality_statuses"
          optional: true

        # Meronimia tra luoghi narrativi (v4.1.1)
        - column: "Is_Part_Of"
          property: "chora:isPartOf"
          to: "@NarrativePlace_ID"
          optional: true

      # Datatype properties
      literal:
        # Labels
        - column: "Narrative_Toponym"
          property: "rdfs:label"
          lang: "it"
        
        # piu' forme separate da ';', un letterale per forma (D-059)
        - column: "Alternative_Toponym"
          property: "skos:altLabel"
          lang: "it"
          optional: true

        # soprannomi (D-059), sottoproprieta' di skos:altLabel
        - column: "Nickname"
          property: "chora:nickname"
          lang: "it"
          optional: true
        
        # Description
        - column: "Description"
          property: "dcterms:description"
          lang: "it"
          optional: true

        # Notes
        - column: "Notes"
          property: "rdfs:comment"
          lang: "it"
          optional: true

        - column: "Fuzziness_Level"
          property: "chora:hasFuzzinessLevel"
          datatype: "xsd:decimal"
          optional: true

# ============================================================
# FILE: GazetteerEntities.tsv (Luoghi topografici esterni)
# ============================================================
  GazetteerEntities:
    source_file: "GazetteerEntities.tsv"
    
    GazetteerEntity_ID:
      as_uri: "https://w3id.org/gaddatlas/id/gazetteer/{value}"
      rdf_type:
        - "chora:GazetteerEntity"
      
      # Object properties
      link:
        # Place Category
        - column: "Place_Category"
          property: "chora:hasPlaceCategory"
          vocabulary: "place_categories"
          optional: true
        
        # sameAs: SOLO URI esterni (Wikidata, Geonames...), coreferenza tecnica.
        # Un id interno fa fallire l'ETL: le identita' fra entita' del dataset
        # sono asserzioni d'identificazione (Assertions.tsv) e le coppie
        # istituzione / sede sono la colonna Housed_In -> chora:housedIn (D-044).
        - column: "sameAs"
          property: "owl:sameAs"
          as_uri: true
          optional: true
      
      # Datatype properties
      literal:
        # Labels
        - column: "Toponym"
          property: "rdfs:label"
          lang: "it"
        
        - column: "Alternative_Toponym"
          property: "skos:altLabel"
          lang: "it"
          optional: true
        
        - column: "Historical_Location"
          property: "chora:historicalLocation"
          lang: "it"
          optional: true
        
        - column: "Present_Location"
          property: "chora:presentLocation"
          lang: "it"
          optional: true
        
        - column: "Authority_Source"
          property: "dcterms:source"
          datatype: "xsd:string"
          optional: true
        
        # Coordinate WGS84
        - column: "Latitude"
          property: "geo:lat"
          datatype: "xsd:decimal"
          optional: true
        
        - column: "Longitude"
          property: "geo:long"
          datatype: "xsd:decimal"
          optional: true
      
      # Geometry (GeoSPARQL)
      geometry:
        - column: "Geometry"
          property: "geosparql:hasGeometry"
          geometry_type: "geosparql:Geometry"
          geojson_property: "geosparql:asGeoJSON"
          optional: true

# ============================================================
# FILE: SpatialInterpretations.tsv (Layer critico PROV)
# ============================================================
  SpatialInterpretations:
    source_file: "SpatialInterpretations.tsv"
    
    Interpretation_ID:
      as_uri: "https://w3id.org/gaddatlas/id/interpretation/{value}"
      rdf_type:
        - "chora:SpatialInterpretation"
        - "prov:Entity"
      
      # Object properties
      link:
        - property: "chora:interpretsReference"
          column: "Reference_ID"
          to: "@Reference_ID"
                
        - property: "chora:assignsNarrativeRole"
          column: "Narrative_Role"
          vocabulary: "narrative_roles"
          optional: true

        # *** RIMOSSO in v4.1.1: chora:assignsRealityStatus spostata su
        # NarrativePlaces.chora:hasRealityStatus (proprietà invariante
        # del luogo, non della interpretazione). ***

        - property: "chora:assignsSpatialDetermination"
          column: "Spatial_Determination"
          vocabulary: "spatial_determinations"
          optional: true

        # *** NUOVO in v4.1.1: hasFocalizer spostato qui da PlaceReference ***
        # Focalizer_ID risolto in join da References.tsv tramite il
        # Reference_ID di chora:interpretsReference (la coppia luogo×focalizzatore
        # è l'unità base del dataset in v4.1.1).
        - property: "chora:hasFocalizer"
          column: "Focalizer_ID"
          to: "@Focalizer_ID"
          optional: true

        # *** D-057 (T-47): ancoraggio relazionale. Relational_Anchor_IDs (piu'
        # entita' separate da '|') e Relational_Anchor_Type (near | between...)
        # diventano un nodo chora:RelationalAnchoring. Un termine puo' essere
        # anche un luogo narrativo (D-058): relazione senza referente (R17)
        # (relanchor/{Interpretation_ID}). Non producono geometria: la posizione
        # sta solo in Anchors_To_Entity_ID. Li legge tools/etl.py. ***

        # *** D-049 (T-36): voce narrante, distinta dal focalizzatore. Si
        # annota solo dove una fonte critica ne discute; cella vuota = «non
        # annotato», non «voce = focalizzatore». ***
        - property: "chora:hasNarratingVoice"
          column: "Narrating_Voice_ID"
          to: "@Focalizer_ID"
          optional: true

        - property: "chora:anchorsToEntity"
          column: "Anchors_To_Entity_ID"
          to: "@GazetteerEntity_ID"
          optional: true

        # *** RIMOSSO in v4.1.1: chora:anchorsToConcept eliminata senza sostituto.
        # chora:anchorsToEntity resta l'unica property di ancoraggio. ***

        - property: "chora:assignsSpatialRelationType"
          column: "Spatial_Relation_Type"
          vocabulary: "spatial_relations"
          optional: true
          # I valori "direct"/"null" sono esclusi a monte in fase di pulizia
          # dati (cella vuota → nessuna tripla, via optional: true). Non
          # devono comparire nel vocabolario spatial_relations sotto.

        - property: "chora:targetsPlace"
          column: "NarrativePlace_ID"
          to: "@NarrativePlace_ID"
          conditional:
            when_column: "Narrative_Role"
            not_equals: "route"

        # *** NUOVO: le righe-tragitto (Narrative_Role == "route")
        # puntano a un individuo chora:NarrativeRoute invece che a
        # chora:NarrativePlace, leggendo lo stesso valore di NarrativePlace_ID
        # usato da targetsPlace (colonna condivisa, discriminata da
        # Narrative_Role/Targets_Type).
        # "@NarrativeRoute_ID" non corrisponde a nessuna chiave di blocco
        # dichiarata in questo yaml (non esiste un foglio NarrativeRoute):
        # la generazione dell'IRI (convenzione suggerita:
        # https://w3id.org/gaddatlas/id/route/{value}) e la tripla
        # rdf:type chora:NarrativeRoute sono responsabilità dell'ETL. ***
        - property: "chora:targetsRoute"
          column: "NarrativePlace_ID"
          to: "@NarrativeRoute_ID"
          conditional:
            when_column: "Narrative_Role"
            equals: "route"

        # *** NUOVO in v4.1.1: i nodi di percorso (righe con
        # Spatial_Component_Role == "routenode") dichiarano l'appartenenza
        # al tragitto. ***
        - property: "chora:isNodeOfRoute"
          column: "Spatial_Component_Of"
          to: "@NarrativeRoute_ID"
          conditional:
            when_column: "Spatial_Component_Role"
            equals: "routenode"

      # PROV properties. Annotator_ID e' obbligatorio e deve essere un agente
      # di Agents.tsv: l'ETL ne fa due attribuzioni qualificate (codificatore e
      # autore della lettura, D-043) piu' la forma breve prov:wasAttributedTo.
      provenance:
        - column: "Annotator_ID"
          property: "prov:wasAttributedTo"
          as_agent: true
          optional: true
        
        - column: "Annotation_Date"
          property: "prov:generatedAtTime"
          datatype: "xsd:dateTime"
          optional: true
      
      # Datatype properties
      literal:
        - column: "Interpretation_Type"
          property: "chora:interpretationType"
          datatype: "xsd:string"
          optional: true
        
        - column: "Confidence"
          property: "chora:confidence"
          datatype: "xsd:decimal"
          optional: true
        
        - column: "Annotation_Method"
          property: "chora:annotationMethod"
          datatype: "xsd:string"
          optional: true
        
        - column: "Evidence_Source"
          property: "chora:evidenceSource"
          lang: "it"
          optional: true
        
        - column: "Critical_Note"
          property: "chora:criticalNote"
          lang: "it"
          optional: true

        # Route order: posizione ordinale del nodo nel tragitto,
        # significativa solo insieme a isNodeOfRoute.
        - column: "Spatial_Component_Order"
          property: "chora:routeOrder"
          datatype: "xsd:integer"
          optional: true
          conditional:
            when_column: "Spatial_Component_Role"
            equals: "routenode"

# ============================================================
# FILE: FocalizingAgents.tsv (Personaggi e narratore)
# ============================================================
  FocalizingAgents:
    source_file: "FocalizingAgents.tsv"
    
    Focalizer_ID:
      as_uri: "https://w3id.org/gaddatlas/id/focalizer/{value}"
      
      rdf_type_conditional:
        column: "Focalizer_Type"
        mapping:
          character: "chora:Character"
          narrator: "chora:Narrator"
      
      # Datatype properties
      literal:
        - column: "Character_Name"
          property: "chora:characterName"
          lang: "it"
          optional: true

        - column: "Narrator_Type"
          property: "chora:narratorType"
          datatype: "xsd:string"
          conditional:
            when_column: "Focalizer_Type"
            equals: "narrator"
        
        - column: "Gender"
          property: "chora:hasGender"
          datatype: "xsd:string"
          optional: true
        
        - column: "Description"
          property: "dcterms:description"
          lang: "it"
          optional: true

# ============================================================
# FILE: LiteraryWorks.tsv (Opere letterarie)
# ============================================================
  LiteraryWorks:
    source_file: "LiteraryWorks.tsv"
    
    Work_ID:
      as_uri: "https://w3id.org/gaddatlas/id/work/{value}"
      rdf_type:
        - "chora:LiteraryWork"
      
      literal:
        - column: "Full_Title"
          property: "dcterms:title"
          lang: "it"
        
        - column: "Author"
          property: "dcterms:creator"
          lang: "it"
        
        - column: "Publication_Year"
          property: "dcterms:date"
          datatype: "xsd:gYear"
          optional: true
        
        - column: "Edition_Used"
          property: "dcterms:bibliographicCitation"
          lang: "it"
          optional: true
        
        - column: "Notes"
          property: "rdfs:comment"
          lang: "it"
          optional: true

        # Opera correlata (D-052): dcterms:relation verso l'opera di cui e'
        # un avantesto o una derivazione (es. Il palazzo degli ori).
        - column: "Related_Work"
          property: "dcterms:relation"
          to: "@Work_ID"
          optional: true

# ============================================================
# FILE: Witnesses.tsv (testimoni dell'opera, D-052)
# ============================================================
# Lo legge tools/etl.py (process_witnesses). Colonne: Witness_ID, Siglum,
# Work_ID, Witness_Type (redazione in rivista | dattiloscritto | bozze |
# princeps | edizione), Date (AAAA o AAAA-MM-GG), Editor, Publisher, Held_At,
# Description, Derived_From (Witness_ID, anche piu' d'uno separati da '|'),
# Derivation_Source, Reference (si = testimone di riferimento dell'opera), Note.
# prov:wasDerivedFrom si scrive solo dove la derivazione e' documentata, con
# la fonte in Derivation_Source.
#
# Allineamento a LRMoo (dichiarato qui, non adottato in blocco):
#   chora:LiteraryWork  ~ lrmoo:F1_Work
#   chora:Witness       ~ lrmoo:F2_Expression (lo stato redazionale) che si
#                         incarna in lrmoo:F3_Manifestation (QPL, QP57, RR II,
#                         QP) o in lrmoo:F5_Item (dtsFG, bzFG, esemplari unici)
#   chora:witnessOf     ~ lrmoo:R3i_realises (Expression -> Work)
#   prov:wasDerivedFrom ~ lrmoo:R76_is_derivative_of
# CHORA non distingue Expression e Manifestation: per i luoghi conta lo stato
# del testo, non l'oggetto fisico.
  Witnesses:
    source_file: "Witnesses.tsv"

    Witness_ID:
      as_uri: "https://w3id.org/gaddatlas/id/witness/{value}"
      rdf_type:
        - "chora:Witness"

# ============================================================
# FILE: Assertions.tsv (letture attribuite, D-042)
# Non ha un blocco di mapping: lo legge tools/etl.py (process_assertions);
# colonne e triple in fondo, sezione `documentation` (D-062).
# perche' Subject e Value puntano a risorse di tipo diverso. Formato:
#   Subject, Value, Author_ID, Encoder_ID = 'tipo/id' relativo a
#   https://w3id.org/gaddatlas/id/ (es. narrativeplace/castello,
#   gazetteer/gaz_castel_gandolfo, annotator/lorenzo_sabatino) oppure
#   'chora:Termine' (es. chora:Invented). Value ed Encoder_ID ammettono piu'
#   valori separati da '|'. Assertion_Type: status | identification | location |
#   partition | memory | uncertainty | variant | route. Adopted: si | no.
# ============================================================

# FILE: Chapters.tsv (Capitoli dell'opera)
# ============================================================
  Chapters:
    source_file: "Chapters.tsv"
    
    Chapter_ID:
      as_uri: "https://w3id.org/gaddatlas/id/chapter/{value}"
      rdf_type:
        - "chora:Chapter"
      
      link:
        - property: "chora:partOfWork"
          column: "Work_ID"
          to: "@Work_ID"
      
      literal:
        - column: "Chapter_Title"
          property: "dcterms:title"
          lang: "it"
        
        - column: "Chapter_Number"
          property: "chora:chapterNumber"
          datatype: "xsd:integer"
          optional: true
        
        - column: "Page_Range"
          property: "chora:pageRange"
          datatype: "xsd:string"
          optional: true

# ============================================================
# NOTE IMPLEMENTATIVE v4.1.1
# ============================================================
#
# 1. SEPARAZIONE EPISTEMICA:
#    - PlaceReference: SOLO metadati testuali/bibliografici (appearsInWork,
#      mentionedInChapter, excerpt, sourceReference). Non risolve alcun
#      referente né porta più alcun default target.
#    - SpatialInterpretation: TUTTE le attribuzioni critiche, inclusi
#      targeting (targetsPlace), focalizzatore (hasFocalizer) e
#      ancoraggio (anchorsToEntity).
#    - Property deprecate (hasNarrativeRole, hasSpatialDetermination) su
#      PlaceReference NON vengono più generate. chora:hasRealityStatus esiste
#      di nuovo in v4.1.1, ma su NarrativePlace (non su PlaceReference): vedi
#      punto 3.
#
# 2. TARGETING SENZA DEFAULT:
#    - Il meccanismo di default target su PlaceReference è stato rimosso
#      integralmente in v4.1.1 (nessun hasDefaultTarget/hasDefaultDiscretePlace/
#      hasDefaultVagueArea). Ogni targeting è asserito esplicitamente da
#      SpatialInterpretation.targetsPlace (verso chora:NarrativePlace, da
#      NarrativePlaces.tsv) o .targetsRoute (verso chora:NarrativeRoute).
#
# 3. ASSIGNS vs HAS:
#    - chora:assignsNarrativeRole (non hasNarrativeRole)
#    - chora:assignsSpatialDetermination (non hasSpatialDetermination)
#    - chora:assignsSpatialRelationType (non hasSpatialRelationType, rinominata
#      in v4.1.1 per uniformità)
#    - ECCEZIONE v4.1.1: chora:hasRealityStatus (non assignsRealityStatus) vive su
#      NarrativePlace, non su SpatialInterpretation: è invariante rispetto al
#      focalizzatore, non una qualificazione critica dell'interpretazione.
#
# 4. ANCHOR E RELAZIONI:
#    - SOLO in SpatialInterpretation
#    - anchorsToEntity è l'UNICA property di ancoraggio in v4.1.1
#      (anchorsToConcept eliminata senza sostituto: non si ancora più a
#      skos:Concept, solo a GazetteerEntity)
#    - assignsSpatialRelationType
#
# 5. PROVENANCE:
#    - Sempre in SpatialInterpretation
#    - wasAttributedTo, generatedAtTime, confidence, criticalNote
#
# 6. JOIN CROSS-FILE RICHIESTI DAL FUTURO ETL v4.1.1:
#    - hasFocalizer: da SpatialInterpretations.tsv, valore Focalizer_ID
#      risolto seguendo interpretsReference fino a References.tsv
#      (dove la colonna Focalizer_ID viveva fino a v4.0-rc1).
#    - hasFuzzinessLevel: mapping spostato da SpatialInterpretations.tsv al
#      blocco NarrativePlaces (il modello VagueArea non esiste più,
#      Fuzziness_Level vive su NarrativePlaces.tsv). Domain OWL allineato a
#      NarrativePlace.
#    - Nessuno script ETL v4.x esiste ancora in questo repository: questi
#      join vanno implementati da zero, non sono una modifica di uno script
#      esistente.
#

# ============================================================
# DOCUMENTAZIONE DEI FOGLI LETTI DAL CODICE (D-062)
# ============================================================
# Questi fogli non hanno un blocco operativo in `mappings`: li traduce
# tools/etl.py con funzioni dedicate, perche' soggetti e valori sono di tipo
# variabile o le righe producono nodi intermedi. La sezione `documentation`
# non e' letta dall'ETL (che usa solo namespaces, constants, vocabularies,
# mappings): serve a chi legge il mapping. Le righe rinviano a tools/etl.py
# alla data della voce D-062; se cambiano, aggiornarle qui.
documentation:

  Assertions:
    source_file: "Assertions.tsv"
    etl: "process_assertions, tools/etl.py r. 1353-1435; atto e codifica: add_reading_provenance r. 1302-1351; materializzazione r. 1437-1452 (D-067)"
    note: >-
      Una riga = una lettura (chora:Assertion), generata da un atto interpretativo
      (hico:InterpretationAct, act/{id}). Se l'autore non e' il codificatore, la
      codifica e' una chora:EncodingActivity (encoding/{id}) con la data della
      codifica, prov:used la fonte, prov:wasInformedBy l'atto; l'atto ha la data
      della fonte. Subject e Value: 'tipo/id' relativo a
      https://w3id.org/gaddatlas/id/ oppure 'chora:Termine'. Value, Author_ID ed
      Encoder_ID ammettono piu' valori separati da '|'.
    columns:
      Assertion_ID:   "IRI assertion/{id}; rdf:type chora:Assertion; atto act/{id}"
      Assertion_Type: "atto: hico:hasInterpretationType: status | identification | location | partition | memory | uncertainty | variant | route"
      Subject:        "lettura: chora:aboutSubject"
      Value:          "lettura: chora:assertsValue (uno per valore)"
      Author_ID:      "atto: prov:qualifiedAssociation (prov:hadRole chora:ReadingAuthor) + prov:wasAssociatedWith; lettura: prov:wasAttributedTo"
      Encoder_ID:     "associazione Encoder sull'atto (se coincide con l'autore) o sulla codifica encoding/{id}"
      Source_Work:    "atto: hico:isExtractedFrom source/{id} (Sources.tsv) o witness/{id} (Witnesses.tsv)"
      Source_Page:    "atto: chora:sourcePage (xsd:string)"
      Adopted:        "lettura: chora:adoptedByProject (xsd:boolean): si | no"
      Rationale:      "atto: chora:rationale (@it)"
      Revision_Of:    "lettura: prov:wasRevisionOf assertion/{id}"
      Date:           "data della codifica: dcterms:date e prov:startedAtTime dell'atto (autore = codificatore) o prov:startedAtTime della codifica"
      Note:           "lettura: rdfs:comment (@it)"
      Rationale_Type: "atto: hico:hasInterpretationCriterion: prova referenziale | prova testuale | lettura critica"
      Review_Status:  "lettura: chora:reviewStatus: bozza | validata"
      Uncertainty_Axis:   "lettura: chora:uncertaintyAxis: nome | identificazione | geometria (solo uncertainty)"
      Uncertainty_Origin: "lettura: chora:uncertaintyOrigin: documentaria | costruttiva (solo uncertainty)"
      Grounded_In:    "lettura: chora:groundedIn reference/{id} (piu' id con '|'); se vuota, default di apply_default_grounding (D-070)"
    derived: "per le letture adottate: chora:hasRouteType (route), chora:identifiedWith (identification), chora:memoryAttribution (memory); per tutte le varianti: chora:hasVariant (D-070)"

  Sources:
    source_file: "Sources.tsv"
    etl: "process_sources, tools/etl.py r. 1254-1276 (D-067)"
    columns:
      Source_ID: "IRI source/{id}; rdf:type chora:Source (sottoclasse di frbr:Expression)"
      Label:     "rdfs:label (chiave autore-data)"
      Reference: "dcterms:bibliographicCitation (@it), dalla bibliografia del Cap. 4"
      Author:    "dcterms:creator (@it)"
      Date:      "dcterms:date (xsd:gYear): e' la data dell'atto di uno studioso"
      Type:      "dcterms:type (@it)"
      Note:      "rdfs:comment (@it)"

  Agents:
    source_file: "Agents.tsv"
    etl: "process_agents, tools/etl.py r. 1133-1159"
    columns:
      Agent_ID:   "IRI annotator/{id} (annotator) o agent/{id} (scholar); rdf:type prov:Agent, prov:Person"
      Name:       "schema:name"
      Agent_Type: "annotator -> rdf:type chora:Annotator; scholar -> rdf:type chora:Scholar (e namespace dell'IRI)"
      Note:       "rdfs:comment (@it)"

  Witnesses:
    source_file: "Witnesses.tsv"
    etl: "process_witnesses, tools/etl.py r. 1078-1125 (IRI dal blocco mappings.Witnesses)"
    columns:
      Witness_ID:   "IRI witness/{id}; rdf:type chora:Witness"
      Siglum:       "rdfs:label"
      Work_ID:      "chora:witnessOf work/{id}"
      Witness_Type: "chora:witnessType: redazione in rivista | dattiloscritto | bozze | princeps | edizione"
      Date:         "dcterms:date (xsd:gYear o xsd:date)"
      Editor:       "chora:editor (@it)"
      Publisher:    "dcterms:publisher (@it)"
      Held_At:      "chora:heldAt (@it)"
      Description:  "dcterms:description (@it)"
      Derived_From: "prov:wasDerivedFrom witness/{id} (richiede Derivation_Source)"
      Derivation_Source: "dcterms:source (@it)"
      Reference:    "si -> work chora:referenceWitness witness"
      Note:         "rdfs:comment (@it)"

  PartitionZones:
    source_file: "PartitionZones.tsv"
    etl: "process_partitions, tools/etl.py r. 1176-1220"
    columns:
      Zone_ID:      "IRI zone/{id}; rdf:type chora:PartitionZone"
      Partition_ID: "IRI partition/{id}; rdf:type chora:Partition; chora:hasZone zone"
      Label:        "rdfs:label (@it) della zona"
      Definition:   "skos:definition (@it) della zona"

  PartitionMembers:
    source_file: "PartitionMembers.tsv"
    etl: "process_partitions, tools/etl.py r. 1176-1220"
    columns:
      NarrativePlace_ID: "soggetto: narrativeplace/{id}"
      Zone_ID:           "chora:inPartitionZone zone/{id}"

  NarrativePlaces_localization:
    source_file: "NarrativePlaces.tsv"
    etl: "process_discrete_narrative_places, tools/etl.py r. 595-604"
    columns:
      Localization_Status: "chora:localizationStatus: analisi non condotta | sospensione motivata | non applicabile; assegnato caso per caso, mai derivato dallo statuto (D-062)"
      Localization_Reason: "chora:localizationReason (@it); obbligatorio con sospensione motivata"

  Locations:
    source_file: "Locations.tsv"
    etl: "process_locations, tools/etl.py r. 1521-1547 (D-069)"
    note: >-
      La geometria del valore di una LocationAssertion. Il resto della lettura
      (soggetto, autore, fonte, adozione) sta in Assertions.tsv, con Value =
      geometry/{Assertion_ID}.
    columns:
      Assertion_ID: "IRI geometry/{id}; rdf:type geo:Geometry"
      Geometry_WKT: "geo:asWKT (geo:wktLiteral), POINT(lon lat)"
      Precision:    "chora:precision (xsd:string)"
      Datum:        "chora:datum (xsd:string)"
      Repertory_ID: "chora:repertory source/{id} (Sources.tsv)"

  SpatialInterpretations_readings:
    source_file: "SpatialInterpretations.tsv"
    etl: "process_spatial_interpretations, provenienza e adozione (D-067, D-070)"
    columns:
      Adopted:           "chora:adoptedByProject (xsd:boolean), sempre scritto: si | no (M2)"
      Reading_Author_ID: "autore della lettura (associazione ReadingAuthor sull'atto); vuoto = Annotator_ID. Se diverso dal codificatore, atto e codifica distinti"
      Revision_Of:       "prov:wasRevisionOf interpretation/{id}"
      Source_ID:         "atto: hico:isExtractedFrom source/{id} o witness/{id}"
      Source_Page:       "atto: chora:sourcePage"
