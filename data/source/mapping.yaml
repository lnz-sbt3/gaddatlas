# ============================================================
# MAPPING YAML v4.1.1 - Gadda Atlas
# Ontologia: v4.1.1
# ============================================================


namespaces:
  chora: "https://w3id.org/chora#"
  id: "https://w3id.org/gaddatlas/id/"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  dcterms: "http://purl.org/dc/terms/"
  geo: "http://www.w3.org/2003/01/geo/wgs84_pos#"
  geosparql: "http://www.opengis.net/ont/geosparql#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  owl: "http://www.w3.org/2002/07/owl#"
  prov: "http://www.w3.org/ns/prov#"

# ============================================================
# COSTANTI GLOBALI
# ============================================================
constants:
  work_uri: "https://w3id.org/gaddatlas/id/work/quer_pasticciaccio_adelphi"
  default_focalizer: "https://w3id.org/gaddatlas/id/focalizer/narrator"
  # Letture di statuto generate per i luoghi Imported senza asserzione
  # esplicita (D-068): data costante, perche' il build sia deterministico (D-022),
  # e motivazione standard (ripetuta nello scopeNote di chora:Imported).
  generated_readings_date: "2026-10-09"
  imported_standard_rationale: "Motivazione standard dello statuto: referente identificato nel repertorio."

# ============================================================
# VOCABOLARI CONTROLLATI
# ============================================================
vocabularies:
  # NarrativeRoleScheme
  narrative_roles:
    setting: "chora:Setting"
    marker: "chora:Marker"
    projectedspace: "chora:ProjectedSpace"
    route: "chora:Route"
    zoneofaction: "chora:ZoneOfAction"
  
  # RealityStatusScheme, nell'ordine della scala (skos:notation 1-4, DM-01)
  reality_statuses:
    imported: "chora:Imported"
    transformed: "chora:Transformed"
    invented: "chora:Invented"
    imagined: "chora:Imagined"
  
  # SpatialDeterminationScheme
  spatial_determinations:
    precise: "chora:Precise"
    approximate: "chora:Approximate"
    relative: "chora:Relative"
    indeterminate: "chora:Indeterminate"
  
  # PlaceCategoryScheme - VALORI IN ITALIANO
  place_categories:
